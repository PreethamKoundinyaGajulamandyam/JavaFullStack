<!DOCTYPE html>
<html>

<head>

    <title>W3Schools_Sample</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
        }

        .logo {
            height: 40px;
            width: 110px;
        }
        .logo:hover {
            background-color: green;
            color: white;
        }

        .white-button {
            background-color: white;
            color: black;
            border: none;
            height: 40px;
            width: 110px;
            cursor: pointer;
        }

        .white-button:hover {
            background-color: green;
            color: white;
        }

        .white-button:active {
            background-color: black;
            color: white;
        }
        .search {
            height: 30px;
            width: 180px;
            border-radius: 20px;
            border: 1px solid gray;
            padding-left: 15px;
        }



        .blk-button {
            background-color: black;
            color: white;
            border: none;
            height: 35px;
            width: 79px;
            cursor: pointer;
        }

        .blk-button:hover {
            background-color: green;
        }



        .black-bar {
            background-color: black;
            padding: 5px;
        }


        .sec1 {
            background-color: #282A35;
            color: white;
            text-align: left;
            padding: 70px;
        }
s
        .sec1 h1 {
            font-size: 50px;
        }

        .sec1 p {
            font-size: 20px;
        }

        .sec2 {
            background-color: #F1F1F1;
            color: black;
            text-align: left;
            padding: 70px;
        }
        .sec2 h1 {
            font-size: 50px;
        }
        .sec2 p {
            font-size: 20px;
        }

        .green-button {
            background-color: green;
            color: white;
            border: none;
            height: 45px;
            width: 160px;
            cursor: pointer;
            font-size: 16px;
        }

        .green-button:hover {
            background-color: darkgreen;
        }

        .arw-button {
            background-color: black;
            color: white;
            border: none;
            height: 35px;
            width: 35px;
            cursor: pointer;
        }
        .arw-button:hover {
            background-color: green;  
        }

    </style>

</head>


<body>

    <div>

        <img src="https://www.w3schools.com/images/w3schools_logo_436_2.png" class = "logo">

        <button class="white-button">Tutorial</button>

        <button class="white-button">References</button>

        <button class="white-button">Exercises</button>

        <button class="white-button">Certificates</button>

        <input class="search" type="text" placeholder="Search..">

    </div>


   
    <div class="black-bar">

        <button class="arw-button"><</button>

        <button class="blk-button">HTML</button>

        <button class="blk-button">CSS</button>

        <button class="blk-button">JavaScript</button>

        <button class="blk-button">Python</button>

        <button class="blk-button">Java</button>

        <button class="blk-button">C++</button>

        <button class="blk-button">PHP</button>

        <button class="blk-button">Ruby</button>

        <button class="blk-button">Swift</button>

        <button class="blk-button">Go</button>

        <button class="blk-button">Kotlin</button>

        <button class="blk-button">Rust</button>

        <button class="blk-button">TypeScript</button>

        <button class="blk-button">SQL</button>

        <button class="arw-button">></button>

    </div>


    <div class="sec1">

        <h1>Learn to Code</h1>

        <p>Free tutorials, examples and references.</p>

        <p>No sign-up needed, just start learning.</p>

        <br>

        <button class="green-button">
            Start Learning
        </button>

    </div>


    <div class = "sec2">

        <p>New!!! </p>
        <h1>W3Schools</h1>

        <h1>Adventure App</h1>


        <p>The W3Schools Adventure app is here! Coding fundamentals as a game. Bite-sized lessons, streaks and XP. Free on iOS and Android.</p>

        <br>

        <button class="green-button">
            DOWNLOAD THE APP
        </button>

    </div>

</body>

</html>
